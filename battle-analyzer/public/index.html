<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splinterlands Battle Analyzer</title>
  <meta name="description" content="AI-powered Splinterlands battle breakdown. Paste any battle URL and get instant analysis.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f14;
      --surface: #16181f;
      --surface-2: #1c1e27;
      --border: #252830;
      --border-bright: #3a3d4d;
      --accent: #c89b3c;
      --accent-dim: rgba(200, 155, 60, 0.12);
      --accent-glow: rgba(200, 155, 60, 0.25);
      --win: #3cb878;
      --win-dim: rgba(60, 184, 120, 0.12);
      --lose: #e05252;
      --lose-dim: rgba(224, 82, 82, 0.12);
      --text: #e8eaf0;
      --text-muted: #8a8fa8;
      --text-dim: #4a4f6a;
      --radius: 10px;
      --radius-sm: 6px;
    }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    .mono { font-family: 'DM Mono', monospace; }

    /* ── Layout ── */
    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    /* ── Header ── */
    .app-header {
      text-align: center;
      padding: 48px 0 40px;
    }

    .app-header .badge {
      display: inline-block;
      background: var(--accent-dim);
      border: 1px solid rgba(200, 155, 60, 0.3);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .app-header h1 {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.1;
    }

    .app-header h1 span {
      color: var(--accent);
    }

    .app-header p {
      color: var(--text-muted);
      font-size: 15px;
      margin-top: 10px;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    /* ── Input ── */
    .url-input-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    .url-input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.15s;
    }

    .url-input::placeholder { color: var(--text-dim); font-family: 'Space Grotesk', sans-serif; font-size: 14px; }
    .url-input:focus { border-color: var(--accent); }

    /* ── Tone Selector ── */
    .tone-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .tone-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 8px 8px;
      text-align: center;
      transition: all 0.15s;
      line-height: 1.3;
    }

    .tone-btn:hover { border-color: var(--border-bright); color: var(--text); }

    .tone-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .tone-btn .tone-icon { display: block; font-size: 18px; margin-bottom: 4px; }
    .tone-btn .tone-label { display: block; font-weight: 600; }
    .tone-btn .tone-desc { display: block; font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .tone-btn.active .tone-desc { color: rgba(200, 155, 60, 0.7); }

    /* ── Analyze Button ── */
    .analyze-btn {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: #0e0f14;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 14px;
      transition: all 0.15s;
    }

    .analyze-btn:hover:not(:disabled) {
      background: #dbb04e;
      transform: translateY(-1px);
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .analyze-btn:active:not(:disabled) { transform: translateY(0); }

    .analyze-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .analyze-btn.loading::after {
      content: '';
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #0e0f14;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    .error-msg {
      background: var(--lose-dim);
      border: 1px solid rgba(224, 82, 82, 0.3);
      border-radius: var(--radius-sm);
      color: var(--lose);
      font-size: 13px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: none;
    }

    .error-msg.visible { display: block; }

    /* ── Battle Card ── */
    #battle-card { display: none; }
    #battle-card.visible { display: block; }

    .winner-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--win-dim);
      border: 1px solid rgba(60, 184, 120, 0.25);
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--win);
    }

    .winner-banner .crown { font-size: 18px; }

    .teams-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 560px) { .teams-grid { grid-template-columns: 1fr; } }

    .team-panel {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
    }

    .team-panel.winner-panel { border-color: rgba(60, 184, 120, 0.3); }
    .team-panel.loser-panel { border-color: rgba(224, 82, 82, 0.2); }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .player-name {
      font-weight: 600;
      font-size: 15px;
      font-family: 'DM Mono', monospace;
    }

    .result-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .result-badge.win { background: var(--win-dim); color: var(--win); border: 1px solid rgba(60,184,120,0.3); }
    .result-badge.lose { background: var(--lose-dim); color: var(--lose); border: 1px solid rgba(224,82,82,0.3); }

    .summoner-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .summoner-row .summoner-icon { font-size: 14px; }

    .monsters-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .monster-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .monster-row .pos {
      width: 16px;
      height: 16px;
      background: var(--border);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--text-dim);
      flex-shrink: 0;
      font-family: 'DM Mono', monospace;
    }

    .match-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-chip {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      padding: 4px 12px;
      color: var(--text-muted);
    }

    .meta-chip strong { color: var(--text); }

    /* ── Analysis Card ── */
    #analysis-card { display: none; }
    #analysis-card.visible { display: block; }

    .analysis-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .tone-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
    }

    .streaming-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    .analysis-output {
      color: var(--text);
      font-size: 15px;
      line-height: 1.75;
      min-height: 40px;
    }

    .analysis-output h3 {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 24px 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .analysis-output h3:first-child { margin-top: 0; }

    .analysis-output p {
      margin-bottom: 10px;
      color: var(--text-muted);
    }

    .analysis-output strong { color: var(--text); }
    .analysis-output em { color: var(--text-muted); }

    .analysis-output ul, .analysis-output ol {
      padding-left: 20px;
      margin-bottom: 10px;
      color: var(--text-muted);
    }

    .analysis-output li { margin-bottom: 4px; }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.7s step-end infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* ── Share Section ── */
    #share-section { display: none; }
    #share-section.visible { display: block; }

    .share-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .share-url {
      flex: 1;
      min-width: 200px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 10px 14px;
      outline: none;
      cursor: text;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-btn {
      background: var(--surface-2);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-sm);
      color: var(--text);
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 18px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn.copied { border-color: var(--win); color: var(--win); }

    /* ── Footer ── */
    .app-footer {
      text-align: center;
      padding-top: 48px;
      color: var(--text-dim);
      font-size: 12px;
    }

    /* ── Loading skeleton ── */
    .skeleton {
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
      height: 14px;
    }

    @keyframes shimmer { to { background-position: -200% 0; } }
  </style>
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="app-header">
      <div class="badge">AI-Powered</div>
      <h1>Splinterlands<br><span>Battle Analyzer</span></h1>
      <p>Paste any battle URL and get an instant AI breakdown of what happened and why.</p>
    </header>

    <!-- Input -->
    <div class="card">
      <p class="card-title">Battle URL or ID</p>

      <div class="url-input-wrap">
        <input
          type="text"
          id="url-input"
          class="url-input"
          placeholder="https://splinterlands.com/battle/sl_... or paste raw ID"
          autocomplete="off"
          spellcheck="false"
        >
      </div>

      <div id="error-msg" class="error-msg"></div>

      <p class="card-title">Analysis Tone</p>
      <div class="tone-selector" id="tone-selector">
        <button class="tone-btn active" data-tone="coach">
          <span class="tone-icon">🎯</span>
          <span class="tone-label">Coach</span>
          <span class="tone-desc">Constructive</span>
        </button>
        <button class="tone-btn" data-tone="analyst">
          <span class="tone-icon">📊</span>
          <span class="tone-label">Analyst</span>
          <span class="tone-desc">Just the facts</span>
        </button>
        <button class="tone-btn" data-tone="savage">
          <span class="tone-icon">🔥</span>
          <span class="tone-label">Savage</span>
          <span class="tone-desc">Brutally honest</span>
        </button>
        <button class="tone-btn" data-tone="mentor">
          <span class="tone-icon">📚</span>
          <span class="tone-label">Mentor</span>
          <span class="tone-desc">Beginner-friendly</span>
        </button>
      </div>

      <button id="analyze-btn" class="analyze-btn">Analyze Battle</button>
    </div>

    <!-- Battle Summary -->
    <div id="battle-card" class="card">
      <div id="winner-banner" class="winner-banner">
        <span class="crown">👑</span>
        <span id="winner-text"></span>
      </div>
      <div class="teams-grid" id="teams-grid"></div>
      <div class="match-meta" id="match-meta"></div>
    </div>

    <!-- Analysis -->
    <div id="analysis-card" class="card">
      <div class="analysis-header">
        <p class="card-title" style="margin-bottom:0">AI Analysis</p>
        <div class="tone-indicator">
          <span class="streaming-dot" id="streaming-dot" style="display:none"></span>
          <span id="tone-label-display"></span>
        </div>
      </div>
      <div class="analysis-output" id="analysis-output"></div>
    </div>

    <!-- Share -->
    <div id="share-section" class="card">
      <p class="card-title">Share This Analysis</p>
      <div class="share-inner">
        <input type="text" class="share-url" id="share-url" readonly>
        <button class="copy-btn" id="copy-btn">Copy Link</button>
      </div>
    </div>

    <footer class="app-footer">
      Not affiliated with Splinterlands or Splinterlands, Inc.
    </footer>

  </div><!-- /.app -->

  <script>
    // ── Configuration ──────────────────────────────────────────────

    const TONE_LABELS = {
      coach:   { icon: '🎯', label: 'Coach' },
      analyst: { icon: '📊', label: 'Analyst' },
      savage:  { icon: '🔥', label: 'Savage' },
      mentor:  { icon: '📚', label: 'Mentor' },
    };

    // ── State ──────────────────────────────────────────────────────

    let currentTone = 'coach';
    let currentBattleId = null;
    let cardCache = null;       // Map: card_detail_id (number) → card name (string)
    let rawAnalysis = '';
    let isAnalyzing = false;

    // ── DOM Helpers ────────────────────────────────────────────────

    const $ = id => document.getElementById(id);

    function showError(msg) {
      const el = $('error-msg');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function clearError() {
      $('error-msg').classList.remove('visible');
    }

    function setLoading(loading) {
      const btn = $('analyze-btn');
      btn.disabled = loading;
      btn.textContent = loading ? 'Analyzing…' : 'Analyze Battle';
      if (loading) btn.classList.add('loading');
      else btn.classList.remove('loading');
      isAnalyzing = loading;
    }

    // ── URL / ID Parsing ───────────────────────────────────────────

    function extractBattleId(input) {
      input = input.trim();
      if (!input) return null;

      // Raw ID — sl_ or sm_ prefix
      if (/^(sl_|sm_)[a-zA-Z0-9]+$/.test(input)) return input;

      // Strip query string after extracting relevant params
      // Handle: /battle/sl_abc123 and /battle/sl_abc123?ref=...
      let m = input.match(/\/battle\/(s[lm]_[a-zA-Z0-9]+)/);
      if (m) return m[1];

      // Handle: ?p=battle&id=sm_abc123 or ?id=sl_abc123
      m = input.match(/[?&]id=(s[lm]_[a-zA-Z0-9]+)/);
      if (m) return m[1];

      // Handle bare IDs embedded in longer strings (fallback)
      m = input.match(/(s[lm]_[a-zA-Z0-9]+)/);
      if (m) return m[1];

      return null;
    }

    // ── Card Cache ─────────────────────────────────────────────────

    async function loadCardCache() {
      if (cardCache) return cardCache;
      try {
        const res = await fetch('/api/cards');
        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          console.warn('Cards API returned non-JSON — skipping card name lookup');
          cardCache = {};
          return cardCache;
        }
        const data = await res.json();
        cardCache = {};
        if (Array.isArray(data)) {
          for (const card of data) {
            if (card.id != null) cardCache[card.id] = card.name || `Card #${card.id}`;
          }
        }
      } catch (e) {
        console.warn('Failed to load card details:', e.message);
        cardCache = {};
      }
      return cardCache;
    }

    function getCardName(card, map) {
      if (card.name && typeof card.name === 'string' && card.name.trim()) {
        return card.name.trim();
      }
      if (card.card_detail_id != null && map && map[card.card_detail_id]) {
        return map[card.card_detail_id];
      }
      return card.card_detail_id ? `Card #${card.card_detail_id}` : 'Unknown';
    }

    // ── Battle Fetch ───────────────────────────────────────────────

    async function fetchBattle(id) {
      const res = await fetch(`/api/battle?id=${encodeURIComponent(id)}`);

      const contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        throw new Error('Proxy returned non-JSON response — check Vercel routing config');
      }

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || `API error ${res.status}`);
      }

      // Some responses wrap data under a .data key
      return data.data || data;
    }

    // ── Battle Normalization ───────────────────────────────────────

    function normalizePlayers(data) {
      // players might be an array or an object keyed by player name
      if (Array.isArray(data.players) && data.players.length >= 2) {
        return data.players;
      }
      // Some older API formats (camelCase)
      if (data.player1 && data.player2) {
        return [data.player1, data.player2];
      }
      // Current API format: player_1/player_2 strings + details JSON string
      if (data.player_1 && data.player_2) {
        let details = {};
        try {
          details = typeof data.details === 'string' ? JSON.parse(data.details) : (data.details || {});
        } catch (e) {
          details = {};
        }
        const team1 = details.team1 || {};
        const team2 = details.team2 || {};
        return [
          { player: data.player_1, team: team1 },
          { player: data.player_2, team: team2 },
        ];
      }
      throw new Error('Could not find player data in battle response. The battle may not exist or the API format has changed.');
    }

    function buildBattleSummary(data, map) {
      const players = normalizePlayers(data);
      const winner = data.winner;

      const formatTeam = (player) => {
        const name = player.player || player.name || 'Unknown';
        const team = player.team || {};
        const summoner = team.summoner ? getCardName(team.summoner, map) : 'Unknown';
        const monsters = Array.isArray(team.monsters)
          ? team.monsters.map(m => getCardName(m, map))
          : [];
        return { name, won: name === winner, summoner, monsters };
      };

      // Normalize ruleset — could be pipe-separated or array
      let ruleset = data.ruleset || 'Standard';
      if (typeof ruleset === 'string') ruleset = ruleset.split('|').map(r => r.trim());

      return {
        id: data.id,
        mana: data.mana_cap,
        ruleset,
        format: data.format || data.match_type || 'Ranked',
        player1: formatTeam(players[0]),
        player2: formatTeam(players[1]),
      };
    }

    // ── Render Battle ──────────────────────────────────────────────

    function renderTeamPanel(team) {
      const isWinner = team.won;
      const monsterRows = team.monsters.map((name, i) => `
        <div class="monster-row">
          <span class="pos">${i + 1}</span>
          <span>${escHtml(name)}</span>
        </div>
      `).join('');

      return `
        <div class="team-panel ${isWinner ? 'winner-panel' : 'loser-panel'}">
          <div class="player-header">
            <span class="player-name">${escHtml(team.name)}</span>
            <span class="result-badge ${isWinner ? 'win' : 'lose'}">${isWinner ? 'WIN' : 'LOSS'}</span>
          </div>
          <div class="summoner-row">
            <span class="summoner-icon">⚔</span>
            ${escHtml(team.summoner)}
          </div>
          <div class="monsters-list">
            ${monsterRows || '<div class="monster-row" style="color:var(--text-dim)">No monsters found</div>'}
          </div>
        </div>
      `;
    }

    function renderBattle(summary) {
      // Winner banner
      const winner = summary.player1.won ? summary.player1 : summary.player2;
      $('winner-text').textContent = `${winner.name} wins this battle`;

      // Teams
      $('teams-grid').innerHTML = renderTeamPanel(summary.player1) + renderTeamPanel(summary.player2);

      // Match meta
      const rulesetStr = Array.isArray(summary.ruleset) ? summary.ruleset.join(' · ') : summary.ruleset;
      $('match-meta').innerHTML = `
        <div class="meta-chip"><strong>${escHtml(String(summary.mana || '?'))}</strong> mana</div>
        <div class="meta-chip">${escHtml(rulesetStr)}</div>
        <div class="meta-chip">${escHtml(summary.format || 'Ranked')}</div>
      `;

      $('battle-card').classList.add('visible');
    }

    // ── Stream Analysis ────────────────────────────────────────────

    async function streamAnalysis(summary) {
      rawAnalysis = '';
      $('analysis-output').innerHTML = '<span class="cursor"></span>';

      const toneInfo = TONE_LABELS[currentTone] || TONE_LABELS.coach;
      $('tone-label-display').textContent = `${toneInfo.icon} ${toneInfo.label}`;
      $('streaming-dot').style.display = 'block';
      $('analysis-card').classList.add('visible');

      // Scroll to analysis card
      setTimeout(() => {
        $('analysis-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);

      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ summary, tone: currentTone }),
      });

      const contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('text/event-stream') && !contentType.includes('application/json')) {
        throw new Error('Analyze endpoint returned unexpected content type');
      }

      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
        throw new Error(err.error || `Analysis failed: ${res.status}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6).trim();
          if (payload === '[DONE]') {
            finishAnalysis();
            return;
          }
          try {
            const { text, error } = JSON.parse(payload);
            if (error) throw new Error(error);
            if (text) {
              rawAnalysis += text;
              renderAnalysisOutput(false);
            }
          } catch (e) {
            if (e.message.startsWith('JSON')) continue; // partial chunk, ignore
            throw e;
          }
        }
      }

      finishAnalysis();
    }

    function renderAnalysisOutput(done) {
      const html = marked.parse(rawAnalysis);
      $('analysis-output').innerHTML = html + (done ? '' : '<span class="cursor"></span>');
    }

    function finishAnalysis() {
      renderAnalysisOutput(true);
      $('streaming-dot').style.display = 'none';
    }

    // ── Share Link ─────────────────────────────────────────────────

    function showShareLink(battleId, tone) {
      const url = new URL(window.location.href);
      url.search = '';
      url.searchParams.set('battle', battleId);
      url.searchParams.set('tone', tone);
      const shareUrl = url.toString();

      history.replaceState(null, '', shareUrl);
      $('share-url').value = shareUrl;
      $('share-section').classList.add('visible');
    }

    $('copy-btn').addEventListener('click', () => {
      const url = $('share-url').value;
      navigator.clipboard.writeText(url).then(() => {
        const btn = $('copy-btn');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy Link';
          btn.classList.remove('copied');
        }, 2000);
      }).catch(() => {
        $('share-url').select();
        document.execCommand('copy');
      });
    });

    // ── Main Analyze Flow ──────────────────────────────────────────

    async function analyze(inputOverride) {
      if (isAnalyzing) return;

      clearError();
      $('battle-card').classList.remove('visible');
      $('analysis-card').classList.remove('visible');
      $('share-section').classList.remove('visible');

      const raw = inputOverride || $('url-input').value;
      const battleId = extractBattleId(raw);

      if (!battleId) {
        showError('Could not find a valid battle ID in that URL. Try pasting the full URL or just the ID (e.g. sl_abc123...).');
        return;
      }

      currentBattleId = battleId;
      setLoading(true);

      try {
        // Load card names in parallel with battle fetch
        const [battleData, map] = await Promise.all([
          fetchBattle(battleId),
          loadCardCache(),
        ]);

        const summary = buildBattleSummary(battleData, map);
        renderBattle(summary);
        setLoading(false);

        await streamAnalysis(summary);
        showShareLink(battleId, currentTone);
      } catch (err) {
        setLoading(false);
        showError(err.message);
        console.error(err);
      }
    }

    // ── Tone Selector ──────────────────────────────────────────────

    $('tone-selector').addEventListener('click', (e) => {
      const btn = e.target.closest('.tone-btn');
      if (!btn) return;
      document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTone = btn.dataset.tone;
    });

    // ── Enter key on input ─────────────────────────────────────────

    $('url-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') analyze();
    });

    $('analyze-btn').addEventListener('click', () => analyze());

    // ── Escape HTML ────────────────────────────────────────────────

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Init: handle URL params ────────────────────────────────────

    function init() {
      // Configure marked
      if (typeof marked !== 'undefined') {
        marked.setOptions({ breaks: true, gfm: true });
      }

      const params = new URLSearchParams(window.location.search);
      const battleParam = params.get('battle');
      const toneParam = params.get('tone');

      if (toneParam && TONE_LABELS[toneParam]) {
        currentTone = toneParam;
        document.querySelectorAll('.tone-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.tone === toneParam);
        });
      }

      if (battleParam) {
        $('url-input').value = battleParam;
        analyze(battleParam);
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
